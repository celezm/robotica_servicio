<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
<title id="title">Barrido en zigzag con 28 waypoints</title>
<desc id="desc">Catorce carriles verticales unidos en una trayectoria continua: baja por el carril derecho y continúa alternando entre carriles conectados por pasos horizontales cortos. El dron aparece en el inicio y la base, abajo a la izquierda, es aproximada.</desc>
<defs>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#e4312b"/></marker>
 <style>
 .route{fill:none;stroke:#e4312b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
 .arrowLine{stroke:#e4312b;stroke-width:2.5;stroke-linecap:round}
 .wp{fill:#fff;stroke:#e4312b;stroke-width:3}
 text{font-family:Arial,Helvetica,sans-serif;fill:#17243b}
 </style>
</defs>
<image href="barrido-zigzag.png" width="1672" height="941"/>
<!-- Limpia el trazado anterior y conserva el marco y el estilo de fondo. -->
<rect x="153" y="80" width="1365" height="669" fill="#c6e6fa"/>
<rect x="147" y="74" width="1377" height="681" fill="none" stroke="#17212d" stroke-width="6"/>
<!-- Un solo trazo conectado: 14 pasadas verticales y 13 enlaces horizontales. -->
